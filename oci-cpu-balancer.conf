# /etc/oci-cpu-balancer.conf
# Configuration for OCI Adaptive CPU Load Balancer & Watchdog
# Modify values and run: sudo systemctl reload oci-cpu-balancer.service

# Lower bound of target system-wide CPU utilization (%)
TARGET_MIN_CPU=40

# Upper bound of target system-wide CPU utilization (%)
# If real workloads exceed this, burner threads immediately drop to 0%
TARGET_MAX_CPU=50

# Polling interval for /proc/stat delta calculation (seconds)
SAMPLE_INTERVAL_SEC=1.0

# Watchdog: CPU utilization percentage below which the system is considered idle
IDLE_THRESHOLD_PERCENT=15

# Watchdog: Consecutive idle hours while service is stopped before auto-starting
IDLE_TRIGGER_HOURS=24

# Logging verbosity (DEBUG, INFO, WARN, ERROR)
LOG_LEVEL=INFO
